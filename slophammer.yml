typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - .
    exclude:
      - "tests/**/*.test.mjs"
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    targets:
      - src/core/approval.ts
      - src/core/limits.ts
  dependency_boundaries:
    - from: .
      allow: []
