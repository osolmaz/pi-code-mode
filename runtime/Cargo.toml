[workspace]
members = ["crates/protocol", "crates/runtime", "crates/host"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.96.1"
repository = "https://github.com/osolmaz/pi-code-mode"

[workspace.dependencies]
anyhow = "=1.0.104"
deno_core = "=0.411.0"
deno_error = "=0.7.1"
futures = "=0.3.34"
landlock = "=0.4.7"
libc = "=0.2.189"
seccompiler = "=0.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "io-std", "macros", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.26.0", features = ["serde", "v4"] }

[profile.release]
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
