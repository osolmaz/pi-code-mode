name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes ripgrep
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm run mutate
      - run: npm run slophammer
